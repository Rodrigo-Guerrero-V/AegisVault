name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-windows:
    name: Build, Attest & Release (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck TypeScript frontend
        run: npx tsc --noEmit

      - name: Run Rust unit & security test suite
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: Build Tauri release installers (.msi & NSIS -setup.exe)
        shell: pwsh
        run: npm run tauri build

      - name: Collect installers into release-assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" | Copy-Item -Destination release-assets/
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*-setup.exe" | Copy-Item -Destination release-assets/
          $files = Get-ChildItem -Path release-assets -File
          if ($files.Count -lt 2) {
            throw "Expected both .msi and -setup.exe installers in release-assets, found $($files.Count)."
          }

      - name: Sign installers with Authenticode (when certificate secrets are configured)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "WINDOWS_CERTIFICATE secret not configured; skipping Authenticode signing (SLSA provenance + SHA256SUMS will still be emitted)."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "aegisvault-codesign.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) {
              throw "signtool.exe not found in Windows SDK."
            }
            foreach ($artifact in Get-ChildItem -Path release-assets -File) {
              & $signtool sign /f $pfxPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 $artifact.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "Authenticode signing failed for $($artifact.Name)"
              }
            }
          } finally {
            if (Test-Path $pfxPath) {
              Remove-Item -Force $pfxPath
            }
          }

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location release-assets
          try {
            $lines = Get-ChildItem -File | Sort-Object Name | ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -Path $_.Name).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
            $lines | Set-Content -Encoding utf8NoBOM -Path "SHA256SUMS.txt"
            Get-Content "SHA256SUMS.txt"
          } finally {
            Pop-Location
          }

      - name: Attest SLSA build provenance for installers and SHA256SUMS.txt
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release-assets/*"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aegisvault-windows-x64
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $assets = Get-ChildItem -Path release-assets -File | Select-Object -ExpandProperty FullName
          gh release create "$env:TAG_NAME" @assets --verify-tag --generate-notes
